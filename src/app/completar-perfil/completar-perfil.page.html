<ion-header>
  <ion-toolbar>
    <ion-title>Completar Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [attr.aria-hidden]="isHidden ? 'true' : null">
  <form [formGroup]="completarPerfilForm" (ngSubmit)="onSaveProfile()">
    <ion-list>
      <ion-item>
        <ion-label position="floating">RUT</ion-label>
        <ion-input formControlName="rut"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Nombre de Usuario</ion-label>
        <ion-input formControlName="nombre_user"></ion-input>
      </ion-item>
    </ion-list>
    <ion-button expand="block" type="submit" [disabled]="!completarPerfilForm.valid">
      Guardar
    </ion-button>
  </form>
  <footer>
    <br>
    <br>
    <br>
    <br>
  </footer>
</ion-content>
